# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - oilshopweb

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read 

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Build with Maven
        working-directory: ./Backend 
        run: mvn clean package -DskipTests

      - name: Locate and prepare executable JAR
        working-directory: ./Backend/target
        run: |
          # Find the executable JAR, excluding plain '.jar.original' files
          JAR_FILE=$(ls *.jar | grep -v '\.original$' | head -n 1)
          echo "Selected deployment artifact: $JAR_FILE"
          mkdir -p ../to-deploy
          cp "$JAR_FILE" ../to-deploy/app.jar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: Backend/to-deploy/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
      
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oilshopweb'
          slot-name: 'Production'
          package: 'app.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FA58345A120144839F2DCEF24A7E0553 }}
